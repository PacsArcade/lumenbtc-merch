<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="4800" viewBox="0 0 3600 4800">
<text x="1800.0" y="900" font-family="Adwaita Sans" font-weight="900" font-size="330" fill="#ffffff" text-anchor="middle" letter-spacing="0" >“MY MONEY'S</text>
<text x="1800.0" y="1280" font-family="Adwaita Sans" font-weight="900" font-size="330" fill="#ffffff" text-anchor="middle" letter-spacing="0" >IN THE BANK.”</text>
<text x="1800.0" y="2200" font-family="Adwaita Sans" font-weight="900" font-size="640" fill="#ff4f00" text-anchor="middle" letter-spacing="0" >IT'S NOT</text>
<text x="1800.0" y="2860" font-family="Adwaita Sans" font-weight="900" font-size="640" fill="#ff4f00" text-anchor="middle" letter-spacing="0" >YOURS.</text>
<text x="1800.0" y="3500.0" font-family="Adwaita Sans" font-weight="700" font-size="170" fill="#ffffff" text-anchor="middle" letter-spacing="0" >you have to ask</text>
<text x="1800.0" y="3712.5" font-family="Adwaita Sans" font-weight="700" font-size="170" fill="#ffffff" text-anchor="middle" letter-spacing="0" >permission to use it.</text>
<text x="1800.0" y="4200" font-family="Press Start 2P" font-weight="400" font-size="96" fill="#ff4f00" text-anchor="middle" letter-spacing="0" >not your keys, not your coins</text>

</svg>
